<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미션 3 · 줄넘기 기록 합계</title>
<style>
  body {
    margin: 0;
    padding: 24px 16px;
    background: #F4F6FB;
    font-family: system-ui, "Malgun Gothic", sans-serif;
    color: #1C2434;
    text-align: center;
  }
  h1 { font-size: 26px; margin: 0 0 8px; }
  .goal {
    max-width: 480px; margin: 0 auto 20px; padding: 10px 14px;
    background: #FFF6D6; border-radius: 8px; font-size: 14px; text-align: left;
  }
  label { display: block; margin: 10px 0 4px; font-weight: 700; }
  input {
    width: 120px; padding: 8px; font: inherit; text-align: center;
    border: 1px solid #D9DFEA; border-radius: 8px;
  }
  button {
    display: block; margin: 20px auto 0; padding: 12px 32px;
    font: inherit; font-weight: 700; font-size: 18px;
    background: #1A5FD0; color: #fff; border: 0; border-radius: 10px; cursor: pointer;
  }
  #total { font-size: 32px; font-weight: 800; margin-top: 20px; }
</style>
</head>
<body>
  <h1>🪢 줄넘기 기록 합계</h1>
  <p class="goal">✅ 기대하는 동작: 1~3회 기록을 넣고 <b>합계 계산</b>을 누르면 세 기록을 더한 값이 나와야 해요. (예: 50 + 60 + 70 = <b>180</b>)</p>

  <label for="try1">1회</label>
  <input id="try1" type="number" value="50">
  <label for="try2">2회</label>
  <input id="try2" type="number" value="60">
  <label for="try3">3회</label>
  <input id="try3" type="number" value="70">

  <button onclick="calc()">합계 계산</button>

  <div id="total"></div>

<script>
  function calc() {
    // 1. 입력칸 세 개의 값을 읽어오기
    var a = document.getElementById('try1').value;
    var b = document.getElementById('try2').value;
    var c = document.getElementById('try3').value;

    // 2. 세 값을 더하기
    var sum = Number(a) + Number(b) + Number(c);

    // 3. 결과를 화면에 보여주기
    document.getElementById('total').textContent = '합계: ' + sum + '개';
  }
</script>
</body>
</html>
