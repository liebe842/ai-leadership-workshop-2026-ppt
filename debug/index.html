<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="UTF-8">
<style>
  :root {
    --bg: #F2F5FA; --card: #FFFFFF; --ink: #1C2434; --muted: #5D6879;
    --line: #D9DFEA; --accent: #1A5FD0; --danger: #C5221F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 110px; }
  h1 { font-size: 28px; margin: 0 0 16px; }
  .panel {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px; margin-bottom: 20px;
  }
  button { font: inherit; cursor: pointer; }
  .msg { margin: 8px 0 0; min-height: 1.6em; }
  .ok { color: #188038; }
  .err { color: var(--danger); }

  /* 목록 위 막대 · 카테고리 버튼 */
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .bar button, .plain {
    padding: 6px 12px; background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; margin-left: 6px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip {
    padding: 4px 14px; background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px;
  }
  .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* 카테고리 묶음 · 사이트 카드 */
  .group h2 { font-size: 18px; margin: 18px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .site {
    display: flex; gap: 10px; align-items: flex-start;
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  }
  .site:hover { border-color: var(--accent); }
  .icon { width: 24px; height: 24px; flex: none; margin-top: 2px; border-radius: 4px; }
  .info { flex: 1; min-width: 0; }
  .info a { color: var(--accent); font-weight: 700; text-decoration: none; overflow-wrap: anywhere; }
  .info a:hover { text-decoration: underline; }
  .host { margin: 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .memo { margin: 4px 0 0; font-size: 14px; overflow-wrap: anywhere; }
  .del {
    flex: none; padding: 0 8px; background: var(--card);
    color: var(--danger); border: 1px solid var(--danger); border-radius: 8px; font-size: 13px;
  }
  .empty { text-align: center; color: var(--muted); padding: 20px 0; margin: 0; }
  .tip { margin: 16px 0 0; color: var(--muted); font-size: 14px; }

  /* 카테고리 관리 (관리 모드) */
  .add-cat { display: flex; gap: 8px; margin-top: 12px; }
  .add-cat input { flex: 1; }
  .cat-list { list-style: none; margin: 0; padding: 0; }
  .cat-list li {
    display: flex; align-items: center; gap: 6px;
    border-top: 1px solid var(--line); padding: 8px 0;
  }
  .cat-list li span { flex: 1; }
  .cat-list .del { padding: 6px 12px; font-size: 15px; }

  /* ＋ 버튼과 추가 창 */
  .fab {
    position: fixed; right: 24px; bottom: 24px; width: 64px; height: 64px;
    border: 0; border-radius: 50%; background: var(--accent); color: #fff;
    font-size: 34px; line-height: 1; box-shadow: 0 6px 18px rgba(26, 95, 208, .35);
  }
  .overlay {
    position: fixed; inset: 0; background: rgba(20, 30, 50, .45);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .overlay[hidden] { display: none; }
  .dialog { width: 100%; max-width: 440px; margin: 0; }
  .dialog h2 { font-size: 20px; margin: 0 0 4px; }
  label { display: block; font-weight: 700; margin: 12px 0 6px; }
  input, select {
    width: 100%; padding: 10px 12px; font: inherit; color: inherit;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card);
  }
  .note { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .actions { display: flex; align-items: center; gap: 4px; margin-top: 16px; }
  .primary {
    padding: 10px 24px; font-weight: 700;
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
  }
  .primary:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🐞 버그 즐겨찾기</h1>

  <!-- 카테고리 관리: 관리 모드에서만 보여요 -->
  <section id="cat-panel" class="panel" hidden>
    <strong>🗂️ 카테고리 관리</strong>
    <div class="add-cat">
      <input id="new-cat" maxlength="20" placeholder="새 카테고리 이름" autocomplete="off">
      <button class="primary" type="button" onclick="saveCategory()">추가</button>
    </div>
    <p id="cat-msg" class="msg" role="status"></p>
    <ul id="cat-list" class="cat-list"></ul>
  </section>

  <!-- 사이트 목록: 누구나 -->
  <section class="panel">
    <div class="bar">
      <strong id="count">사이트 목록</strong>
      <span>
        <button type="button" onclick="loadSites()">새로고침</button>
        <button id="admin-btn" type="button" onclick="toggleAdmin()">관리 모드</button>
      </span>
    </div>
    <div id="chips" class="chips"></div>
    <p id="list-msg" class="msg" role="status"></p>
    <div id="list"></div>
    <p class="tip">💡 구글 시트의 ‘즐겨찾기’ 탭에 한 줄씩 직접 적어도 돼요.
      (A 카테고리 · B 사이트 이름 · C 주소 · D 메모) 적은 뒤 새로고침을 누르세요.</p>
  </section>
</div>

<!-- ＋ 버튼: 누르면 추가 창이 열려요 -->
<button class="fab" type="button" onclick="openAdd()" aria-label="사이트 추가" title="사이트 추가">＋</button>

<div id="add-box" class="overlay" hidden onclick="if (event.target === this) closeAdd()">
  <section class="panel dialog" role="dialog" aria-labelledby="add-title">
    <h2 id="add-title">＋ 사이트 추가</h2>
    <label for="category">카테고리</label>
    <select id="category"></select>
    <p class="note">원하는 카테고리가 없으면 관리 모드에서 추가해요.</p>
    <label for="name">사이트 이름</label>
    <input id="name" maxlength="40" placeholder="예: 나이스" autocomplete="off">
    <label for="url">주소</label>
    <input id="url" maxlength="500" placeholder="예: neis.go.kr" autocomplete="off">
    <label for="memo">메모 (선택)</label>
    <input id="memo" maxlength="100" placeholder="예: 성적·출결 입력" autocomplete="off">
    <div class="actions">
      <button id="save" class="primary" type="button" onclick="saveSite()">저장</button>
      <button class="plain" type="button" onclick="closeAdd()">닫기</button>
    </div>
    <p id="add-msg" class="msg" role="status"></p>
  </section>
</div>

<script>
  var adminPw = '';    // 관리 모드일 때만 비밀번호를 잠시 기억
  var allData = { categories: [], sites: [] }; // 마지막으로 불러온 카테고리와 사이트
  var currentCat = ''; // 지금 고른 카테고리 ('' 이면 전체)

  function $(id) { return document.getElementById(id); }

  function setMsg(id, text, type) {
    $(id).textContent = text || '';
    $(id).className = 'msg' + (type ? ' ' + type : '');
  }

  function errText(e) {
    return (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, '');
  }

  function makeButton(text, className, onClick) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = className;
    b.textContent = text;
    b.onclick = onClick;
    return b;
  }

  // ---------- ＋ 추가 창 ----------
  function openAdd() {
    setMsg('add-msg', '');
    if (currentCat) $('category').value = currentCat; // 보고 있던 카테고리를 미리 골라 두기
    $('add-box').hidden = false;
    $('name').focus();
  }

  function closeAdd() { $('add-box').hidden = true; }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeAdd();
  });

  function saveSite() {
    var category = $('category').value, name = $('name').value, url = $('ur').value, memo = $('memo').value;
    if (!name.trim() || !url.trim()) {
      setMsg('add-msg', '사이트 이름과 주소를 적어 주세요.', 'err');
      return;
    }
    $('save').disabled = true;
    setMsg('add-msg', '저장하는 중…');
    google.script.run
      .withSuccessHandler(function () {
        $('save').disabled = false;
        $('name').value = ''; $('url').value = ''; $('memo').value = '';
        closeAdd();
        loadSites('저장했어요!');
      })
      .withFailureHandler(function (e) {
        $('save').disabled = false;
        setMsg('add-msg', errText(e), 'err');
      })
      .addSite(category, name, url, memo);
  }

  // ＋ 창의 카테고리 드롭다운 채우기
  function fillCategorySelect(cats) {
    var select = $('category');
    var picked = select.value;
    select.textContent = '';
    (cats.length ? cats : ['기타']).forEach(function (cat) {
      var o = document.createElement('option');
      o.value = cat;
      o.textContent = cat;
      select.appendChild(o);
    });
    if (cats.indexOf(picked) >= 0) select.value = picked; // 고르던 것은 그대로
  }

  // ---------- 사이트 목록 ----------
  function loadSites(doneMsg) {
    setMsg('list-msg', '불러오는 중…');
    google.script.run
      .withSuccessHandler(function (data) { setMsg('list-msg', doneMsg || '', 'ok'); render(data); })
      .withFailureHandler(function (e) { setMsg('list-msg', errText(e), 'err'); })
      .getData();
  }

  function render(data) {
    allData = data;
    var cats = data.categories, sites = data.sites;
    $('count').textContent = '사이트 ' + sites.length + '개';
    fillCategorySelect(cats);
    renderCategoryPanel(cats, sites);
    var list = $('list');
    list.textContent = '';
    $('chips').textContent = '';
    if (!sites.length) {
      list.appendChild(emptyText('아직 저장한 사이트가 없어요. ＋ 버튼으로 첫 사이트를 추가해 보세요!'));
      return;
    }
    if (cats.indexOf(currentCat) < 0) currentCat = ''; // 고른 카테고리가 없어졌으면 전체로

    var box = document.createDocumentFragment();
    cats.forEach(function (cat) {
      if (currentCat && cat !== currentCat) return;
      var group = sites.filter(function (s) { return s.category === cat; });
      if (group.length) box.appendChild(buildGroup(cat, group));
    });
    if (!box.childNodes.length) box.appendChild(emptyText('이 카테고리에는 아직 사이트가 없어요.'));
    list.appendChild(box);
    buildChips(cats);
  }

  function emptyText(text) {
    var p = document.createElement('p');
    p.className = 'empty';
    p.textContent = text;
    return p;
  }

  // 카테고리 버튼: 전체 + 카테고리마다 하나
  function buildChips(cats) {
    [''].concat(cats).forEach(function (cat) {
      var b = makeButton(cat || '전체', 'chip' + (cat === currentCat ? ' on' : ''), function () {
        currentCat = cat;
        render(allData);
      });
      $('chips').appendChild(b);
    });
  }

  function buildGroup(cat, sites) {
    var sec = document.createElement('section');
    sec.className = 'group';
    var h2 = document.createElement('h2');
    h2.textContent = '📁 ' + cat + ' (' + sites.length + ')';
    sec.appendChild(h2);
    var grid = document.createElement('div');
    grid.className = 'grid';
    sites.forEach(function (site) { grid.appendChild(buildSite(site)); });
    sec.appendChild(grid);
    return sec;
  }

  function buildSite(site) {
    // 시트에 https:// 없이 적었어도 열리게
    var href = /^https?:\/\//i.test(site.url) ? site.url : 'https://' + site.url;
    var host = hostOf(href);

    var card = document.createElement('article');
    card.className = 'site';

    var icon = document.createElement('img');
    icon.className = 'icon';
    icon.alt = '';
    icon.src = 'https://www.google.com/s2/favicons?sz=64&domain=' + encodeURIComponent(host);
    card.appendChild(icon);

    var info = document.createElement('div');
    info.className = 'info';
    var a = document.createElement('a');
    a.href = href;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = site.name;
    info.appendChild(a);
    var hostLine = document.createElement('p');
    hostLine.className = 'host';
    hostLine.textContent = host;
    info.appendChild(hostLine);
    if (site.memo) {
      var memo = document.createElement('p');
      memo.className = 'memo';
      memo.textContent = site.memo;
      info.appendChild(memo);
    }
    card.appendChild(info);

    if (adminPw) {
      card.appendChild(makeButton('삭제', 'del', function () { removeSite(site); }));
    }
    return card;
  }

  // 주소에서 사이트 부분만 꺼내기 (https://www.naver.com/abc → www.naver.com)
  function hostOf(url) {
    var parts = url.spilt('/');
    return parts[2] || url;
  }

  // ---------- 관리 모드 ----------
  function toggleAdmin() {
    if (adminPw) {
      adminPw = '';
      $('admin-btn').textContent = '관리 모드';
      render(allData);
      return;
    }
    var input = prompt('관리 비밀번호를 입력하세요.');
    if (!input) return;
    google.script.run
      .withSuccessHandler(function () {
        adminPw = input;
        $('admin-btn').textContent = '관리 모드 끄기';
        setMsg('list-msg', '');
        render(allData);
      })
      .withFailureHandler(function (e) { setMsg('list-msg', errText(e), 'err'); })
      .checkAdmin(input);
  }

  function removeSite(site) {
    if (!confirm('‘' + site.name + '’을(를) 삭제할까요? 되돌릴 수 없어요.')) return;
    google.script.run
      .withSuccessHandler(function () { loadSites('삭제했어요.'); })
      .withFailureHandler(function (e) { setMsg('list-msg', errText(e), 'err'); })
      .deleteSite(adminPw, site.row, site.url);
  }

  // ---------- 카테고리 관리 (관리 모드) ----------
  function renderCategoryPanel(cats, sites) {
    $('cat-panel').hidden = !adminPw;
    if (!adminPw) return;
    var ul = $('cat-list');
    ul.textContent = '';
    cats.forEach(function (cat) {
      var count = sites.filter(function (s) { return s.category === cat; }).length;
      var li = document.createElement('li');
      var label = document.createElement('span');
      label.textContent = cat + ' (' + count + ')';
      li.appendChild(label);
      li.appendChild(makeButton('이름 바꾸기', 'plain', function () { editCategory(cat); }));
      li.appendChild(makeButton('삭제', 'del', function () { removeCategory(cat, count); }));
      ul.appendChild(li);
    });
  }

  // 관리 작업이 끝나면 메시지를 보여 주고 목록을 새로 불러오기
  function adminRun(doneMsg, after) {
    setMsg('cat-msg', '처리하는 중…');
    return google.script.run
      .withSuccessHandler(function () {
        if (after) after();
        setMsg('cat-msg', doneMsg, 'ok');
        loadSites();
      })
      .withFailureHandler(function (e) { setMsg('cat-msg', errText(e), 'err'); });
  }

  function saveCategory() {
    var name = $('new-cat').value.trim();
    if (!name) {
      setMsg('cat-msg', '카테고리 이름을 적어 주세요.', 'err');
      return;
    }
    adminRun('‘' + name + '’ 카테고리를 추가했어요.', function () { $('new-cat').value = ''; })
      .addCategory(adminPw, name);
  }

  function editCategory(name) {
    var newName = prompt('‘' + name + '’의 새 이름을 적어 주세요.', name);
    if (!newName || newName.trim() === name) return;
    newName = newName.trim();
    adminRun('이름을 ‘' + newName + '’(으)로 바꿨어요.', function () {
      if (currentCat === name) currentCat = newName; // 보고 있던 카테고리면 새 이름으로 계속 보기
    }).renameCategory(adminPw, name, newName);
  }

  function removeCategory(name, count) {
    var question = '‘' + name + '’ 카테고리를 삭제할까요?';
    if (count) question += '\n안에 있는 사이트 ' + count + '개는 ‘기타’로 옮겨져요.';
    if (!confirm(question)) return;
    adminRun('‘' + name + '’ 카테고리를 삭제했어요.').deleteCategory(adminPw, name);
  }

  loadSite();
</script>
</body>
</html>
