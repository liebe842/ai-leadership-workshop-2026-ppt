<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="UTF-8">
<style>
  :root {
    --bg: #F2F5FA; --card: #FFFFFF; --ink: #1C2434; --muted: #5D6879;
    --line: #D9DFEA; --accent: #1A5FD0; --danger: #C5221F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 16px; }
  .panel {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px; margin-bottom: 20px;
  }
  label { display: block; font-weight: 700; margin: 12px 0 6px; }
  label:first-child { margin-top: 0; }
  input, textarea {
    width: 100%; padding: 10px 12px; font: inherit; color: inherit;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card);
  }
  textarea { resize: vertical; }
  button { font: inherit; cursor: pointer; }
  .primary {
    margin-top: 14px; padding: 12px 24px; font-weight: 700;
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
  }
  .primary:disabled { opacity: .5; cursor: default; }
  .msg { margin: 10px 0 0; min-height: 1.6em; }
  .ok { color: #188038; }
  .err { color: var(--danger); }

  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .bar button {
    padding: 6px 12px; background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; margin-left: 6px;
  }
  .post { border-top: 1px solid var(--line); padding: 16px 0; }
  .post:first-child { border-top: 0; padding-top: 4px; }
  .head { display: flex; justify-content: space-between; gap: 12px; }
  .head h2 { font-size: 19px; margin: 0; }
  .del {
    flex: none; padding: 2px 10px; background: var(--card);
    color: var(--danger); border: 1px solid var(--danger); border-radius: 8px;
  }
  .meta { margin: 2px 0 8px; color: var(--muted); font-size: 14px; }
  .body { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .body a { color: var(--accent); font-weight: 700; }
  .empty { text-align: center; color: var(--muted); padding: 20px 0; margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📌 우리들의 게시판</h1>

  <!-- 글쓰기: 누구나 -->
  <section class="panel">
    <label for="name">이름</label>
    <input id="name" maxlength="20" autocomplete="off">
    <label for="title">제목</label>
    <input id="title" maxlength="50" autocomplete="off">
    <label for="content">내용 (웹앱 주소를 넣으면 클릭할 수 있는 링크가 돼요)</label>
    <textarea id="content" rows="4" maxlength="1000"></textarea>
    <button id="send" class="primary" type="button" onclick="sendPost()">올리기</button>
    <p id="write-msg" class="msg" role="status"></p>
  </section>

  <!-- 글 목록: 누구나 -->
  <section class="panel">
    <div class="bar">
      <strong id="count">글 목록</strong>
      <span>
        <button type="button" onclick="loadPosts()">새로고침</button>
        <button id="admin-btn" type="button" onclick="toggleAdmin()">선생님 모드</button>
      </span>
    </div>
    <p id="list-msg" class="msg" role="status"></p>
    <div id="list"></div>
  </section>
</div>

<script>
  var adminPw = ''; // 선생님 모드일 때만 비밀번호를 잠시 기억

  function $(id) { return document.getElementById(id); }

  function setMsg(id, text, type) {
    $(id).textContent = text || '';
    $(id).className = 'msg' + (type ? ' ' + type : '');
  }

  function errText(e) {
    return (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, '');
  }

  // ---------- 글쓰기 ----------
  function sendPost() {
    var name = $('name').value, title = $('title').value, content = $('content').value;
    if (!name.trim() || !title.trim() || !content.trim()) {
      setMsg('write-msg', '이름, 제목, 내용을 모두 적어 주세요.', 'err');
      return;
    }
    $('send').disabled = true;
    setMsg('write-msg', '올리는 중…');
    google.script.run
      .withSuccessHandler(function () {
        $('send').disabled = false;
        $('title').value = ''; $('content').value = '';
        setMsg('write-msg', '글이 올라갔어요!', 'ok');
        loadPosts();
      })
      .withFailureHandler(function (e) {
        $('send').disabled = false;
        setMsg('write-msg', errText(e), 'err');
      })
      .addPost(name, title, content);
  }

  // ---------- 글 목록 ----------
  function loadPosts() {
    setMsg('list-msg', '불러오는 중…');
    google.script.run
      .withSuccessHandler(function (posts) { setMsg('list-msg', ''); render(posts); })
      .withFailureHandler(function (e) { setMsg('list-msg', errText(e), 'err'); })
      .getPosts();
  }

  function render(posts) {
    $('count').textContent = '글 ' + posts.length + '개';
    var list = $('list');
    list.textContent = '';
    if (!posts.length) {
      var p = document.createElement('p');
      p.className = 'empty';
      p.textContent = '아직 글이 없어요. 첫 글을 남겨 보세요!';
      list.appendChild(p);
      return;
    }
    posts.forEach(function (post) { list.appendChild(buildPost(post)); });
  }

  function buildPost(post) {
    var art = document.createElement('article');
    art.className = 'post';

    var head = document.createElement('div');
    head.className = 'head';
    var h2 = document.createElement('h2');
    h2.textContent = post.title;
    head.appendChild(h2);
    if (adminPw) {
      var del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.textContent = '삭제';
      del.onclick = function () { removePost(post.id); };
      head.appendChild(del);
    }
    art.appendChild(head);

    var meta = document.createElement('p');
    meta.className = 'meta';
    meta.textContent = post.name + ' · ' + post.time;
    art.appendChild(meta);

    var body = document.createElement('p');
    body.className = 'body';
    addLinkedText(body, post.content);
    art.appendChild(body);

    return art;
  }

  // 내용 속 http(s) 주소는 링크로, 나머지는 글자 그대로 넣기
  function addLinkedText(parent, text) {
    var parts = text.split(/(https?:\/\/[^\s]+)/g);
    parts.forEach(function (part) {
      if (/^https?:\/\//.test(part)) {
        var a = document.createElement('a');
        a.href = part;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = '🔗 열어 보기';
        a.title = part;
        parent.appendChild(a);
      } else if (part) {
        parent.appendChild(document.createTextNode(part));
      }
    });
  }

  // ---------- 선생님 모드 · 삭제 ----------
  function toggleAdmin() {
    if (adminPw) {
      adminPw = '';
      $('admin-btn').textContent = '선생님 모드';
      loadPosts();
      return;
    }
    var input = prompt('선생님 비밀번호를 입력하세요.');
    if (!input) return;
    adminPw = input;
    $('admin-btn').textContent = '선생님 모드 끄기';
    loadPosts();
  }

  function removePost(id) {
    if (!confirm('이 글을 삭제할까요? 되돌릴 수 없어요.')) return;
    google.script.run
      .withSuccessHandler(function () { loadPosts(); })
      .withFailureHandler(function (e) { setMsg('list-msg', errText(e), 'err'); })
      .deletePost(adminPw, id);
  }

  loadPosts();
</script>
</body>
</html>
